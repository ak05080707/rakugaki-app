; 1回の検索で表示する最大件数
最大表示件数 = 30

; 全員に返信（CCも含める）なら yes、差出人だけなら no
全員に返信 = no

; 保存後にOutlookの下書き画面を開くなら yes
保存後に表示 = yes

[Claude]
; 使用するモデル（基本は変更不要）
