<title>Rakugaki</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<style>
:root {
  --bg: #E6E9EF;
  --canvas-bg: #FCFCFA;
  --toolbar-bg: #1C1F26;
  --toolbar-text: #B8BCC6;
  --toolbar-text-active: #FFFFFF;
  --accent: #4F7CFF;
  --accent-hover: #3B65E0;
  --danger: #E85454;
  --border: #CDD0D8;
  --shadow: rgba(28, 31, 38, 0.15);
  --drop-zone-border: var(--accent);
  --drop-zone-bg: rgba(79, 124, 255, 0.06);
  --tooltip-bg: #2A2D36;
  --tooltip-text: #E0E2E8;
  --panel-bg: #F0F2F6;
  --panel-text: #1C1F26;
  --panel-text-muted: #6B7080;
  --panel-border: #D4D6DB;
  --toast-bg: #1C1F26;
  --toast-text: #FFFFFF;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318;
    --canvas-bg: #1A1D24;
    --toolbar-bg: #0C0E12;
    --toolbar-text: #6B7080;
    --toolbar-text-active: #E0E2E8;
    --accent: #6B93FF;
    --accent-hover: #5A80F0;
    --danger: #F06B6B;
    --border: #2A2D36;
    --shadow: rgba(0, 0, 0, 0.4);
    --drop-zone-border: var(--accent);
    --drop-zone-bg: rgba(107, 147, 255, 0.08);
    --tooltip-bg: #2A2D36;
    --tooltip-text: #E0E2E8;
    --panel-bg: #1A1D24;
    --panel-text: #E0E2E8;
    --panel-text-muted: #6B7080;
    --panel-border: #2A2D36;
    --toast-bg: #E0E2E8;
    --toast-text: #111318;
  }
}
:root[data-theme="dark"] {
  --bg: #111318;
  --canvas-bg: #1A1D24;
  --toolbar-bg: #0C0E12;
  --toolbar-text: #6B7080;
  --toolbar-text-active: #E0E2E8;
  --accent: #6B93FF;
  --accent-hover: #5A80F0;
  --danger: #F06B6B;
  --border: #2A2D36;
  --shadow: rgba(0, 0, 0, 0.4);
  --drop-zone-border: var(--accent);
  --drop-zone-bg: rgba(107, 147, 255, 0.08);
  --tooltip-bg: #2A2D36;
  --tooltip-text: #E0E2E8;
  --panel-bg: #1A1D24;
  --panel-text: #E0E2E8;
  --panel-text-muted: #6B7080;
  --panel-border: #2A2D36;
  --toast-bg: #E0E2E8;
  --toast-text: #111318;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

body {
  font-family: 'Noto Sans JP', 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--toolbar-text-active);
  height: 100vh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

.app {
  display: flex;
  height: 100vh;
  width: 100vw;
  position: relative;
}

.canvas-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.canvas-wrapper {
  position: relative;
  box-shadow: 0 4px 24px var(--shadow);
  border-radius: 4px;
  overflow: hidden;
  cursor: crosshair;
  transform-origin: center center;
  transition: transform 0.15s ease;
}

.zoom-indicator {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--toolbar-bg);
  color: var(--toolbar-text-active);
  padding: 4px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  z-index: 100;
  box-shadow: 0 2px 12px var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

.zoom-indicator.show { opacity: 1; }

.canvas-wrapper canvas {
  display: block;
  position: absolute;
  top: 0;
  left: 0;
}

#bg-canvas { z-index: 1; }
#draw-canvas { z-index: 2; }
#preview-canvas { z-index: 3; pointer-events: none; }

/* Toolbar */
.toolbar {
  position: fixed;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--toolbar-bg);
  border-radius: 14px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  z-index: 100;
  box-shadow: 0 4px 20px var(--shadow);
}

.toolbar button {
  width: 40px;
  height: 40px;
  border: none;
  background: transparent;
  color: var(--toolbar-text);
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s;
  position: relative;
}

.toolbar button:hover {
  background: rgba(255,255,255,0.08);
  color: var(--toolbar-text-active);
}

.toolbar button.active {
  background: var(--accent);
  color: #fff;
}

.toolbar button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.toolbar .sep {
  height: 1px;
  background: rgba(255,255,255,0.1);
  margin: 4px 6px;
}

.toolbar button svg {
  width: 20px;
  height: 20px;
  stroke-width: 1.8;
  fill: none;
  stroke: currentColor;
}

/* Right panel */
.right-panel {
  position: fixed;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--toolbar-bg);
  border-radius: 14px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  z-index: 100;
  box-shadow: 0 4px 20px var(--shadow);
}

.right-panel button {
  width: 40px;
  height: 40px;
  border: none;
  background: transparent;
  color: var(--toolbar-text);
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s;
  position: relative;
}

.right-panel button:hover {
  background: rgba(255,255,255,0.08);
  color: var(--toolbar-text-active);
}

.right-panel button.active {
  background: var(--accent);
  color: #fff;
}

.right-panel button.recording {
  background: var(--danger);
  color: #fff;
  animation: pulse 1.2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(232, 84, 84, 0.4); }
  50% { box-shadow: 0 0 0 6px rgba(232, 84, 84, 0); }
}

.right-panel button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.right-panel .sep {
  height: 1px;
  background: rgba(255,255,255,0.1);
  margin: 4px 6px;
}

.right-panel button svg {
  width: 20px;
  height: 20px;
  stroke-width: 1.8;
  fill: none;
  stroke: currentColor;
}

.right-panel [data-tip]::after {
  left: auto;
  right: calc(100% + 10px);
}

/* Bottom bar */
.bottom-bar {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--toolbar-bg);
  border-radius: 14px;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 100;
  box-shadow: 0 4px 20px var(--shadow);
}

.color-swatches {
  display: flex;
  gap: 4px;
  align-items: center;
}

.color-swatch {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s;
  position: relative;
}

.color-swatch:hover { transform: scale(1.15); }
.color-swatch.active { border-color: var(--accent); transform: scale(1.15); }

.color-custom {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px dashed var(--toolbar-text);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.color-custom input {
  position: absolute;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

.color-custom svg {
  width: 14px;
  height: 14px;
  stroke: var(--toolbar-text);
  fill: none;
  stroke-width: 2;
  pointer-events: none;
}

.bar-sep {
  width: 1px;
  height: 28px;
  background: rgba(255,255,255,0.1);
}

.size-control, .opacity-control {
  display: flex;
  align-items: center;
  gap: 8px;
}

.size-control input[type="range"],
.opacity-control input[type="range"] {
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  outline: none;
}

.size-control input[type="range"] { width: 80px; }
.opacity-control input[type="range"] { width: 60px; }

.size-control input[type="range"]::-webkit-slider-thumb,
.opacity-control input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

.size-control input[type="range"]::-moz-range-thumb,
.opacity-control input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  cursor: pointer;
}

.paper-size-control {
  display: flex;
  gap: 4px;
}

.paper-btn {
  padding: 3px 10px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 5px;
  background: transparent;
  color: var(--toolbar-text);
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}

.paper-btn:hover { background: rgba(255,255,255,0.1); }

.paper-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.bar-sep-inline {
  width: 1px;
  height: 18px;
  background: rgba(255,255,255,0.15);
  margin: 0 4px;
}

.size-label, .opacity-label {
  color: var(--toolbar-text);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.size-label { min-width: 28px; }
.opacity-label { min-width: 32px; }

/* Drop zone */
.drop-zone {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 50;
  gap: 16px;
}

.drop-zone-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 48px 64px;
  border: 2px dashed var(--border);
  border-radius: 16px;
  transition: border-color 0.2s, background 0.2s;
}

.drop-zone.dragover .drop-zone-inner {
  border-color: var(--drop-zone-border);
  background: var(--drop-zone-bg);
}

.drop-zone svg {
  width: 48px;
  height: 48px;
  stroke: var(--toolbar-text);
  fill: none;
  stroke-width: 1.5;
}

.drop-zone p {
  color: var(--toolbar-text);
  font-size: 15px;
  font-weight: 500;
}

.drop-zone .hint {
  font-size: 13px;
  color: var(--toolbar-text);
  opacity: 0.6;
}

.drop-zone button {
  padding: 10px 24px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}

.drop-zone button:hover { background: var(--accent-hover); }
.drop-zone button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Tooltip */
[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  left: calc(100% + 10px);
  top: 50%;
  transform: translateY(-50%);
  background: var(--tooltip-bg);
  color: var(--tooltip-text);
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 6px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
}

[data-tip]:hover::after { opacity: 1; }

/* Cursor preview */
.cursor-preview {
  position: fixed;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.5);
  pointer-events: none;
  z-index: 99;
  mix-blend-mode: difference;
  display: none;
}

/* Text input overlay */
.text-input-overlay {
  position: absolute;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.text-input-overlay textarea {
  font-family: 'Noto Sans JP', 'DM Sans', system-ui, sans-serif;
  background: rgba(255,255,255,0.9);
  border: 2px solid var(--accent);
  border-radius: 6px;
  color: #1C1F26;
  resize: both;
  outline: none;
  padding: 6px 8px;
  min-width: 120px;
  min-height: 36px;
  line-height: 1.4;
}

.text-toolbar {
  display: flex;
  gap: 4px;
  align-items: center;
}

.text-toolbar button {
  padding: 4px 10px;
  border: none;
  border-radius: 5px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.12s;
}

.text-toolbar .btn-confirm {
  background: var(--accent);
  color: #fff;
}

.text-toolbar .btn-confirm:hover { background: var(--accent-hover); }

.text-toolbar .btn-cancel {
  background: rgba(0,0,0,0.1);
  color: var(--panel-text);
}

.text-toolbar .btn-mic {
  width: 28px;
  height: 28px;
  padding: 0;
  background: transparent;
  border: 1px solid var(--panel-border);
  color: var(--panel-text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}

.text-toolbar .btn-mic.recording {
  background: var(--danger);
  border-color: var(--danger);
  color: #fff;
  animation: pulse 1.2s ease-in-out infinite;
}

.text-toolbar .btn-mic svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

.text-toolbar select {
  padding: 3px 6px;
  border: 1px solid var(--panel-border);
  border-radius: 5px;
  font-family: inherit;
  font-size: 11px;
  background: rgba(255,255,255,0.9);
  color: var(--panel-text);
  outline: none;
  cursor: pointer;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 72px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--toast-bg);
  color: var(--toast-text);
  padding: 8px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 200;
  box-shadow: 0 4px 16px var(--shadow);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Save overlay */
.save-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-bg, rgba(28,31,38,0.6));
  z-index: 300;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.save-overlay img {
  max-width: 80vw;
  max-height: 60vh;
  border-radius: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.save-overlay .save-hint {
  color: #fff;
  font-size: 15px;
  font-weight: 500;
  text-align: center;
  line-height: 1.6;
}

.save-overlay .save-actions {
  display: flex;
  gap: 8px;
}

.save-overlay .save-actions button {
  padding: 8px 20px;
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}

.save-overlay .btn-download {
  background: var(--accent);
  color: #fff;
}

.save-overlay .btn-download:hover { background: var(--accent-hover); }

.save-overlay .btn-close-overlay {
  background: rgba(255,255,255,0.15);
  color: #fff;
}

.save-overlay .btn-close-overlay:hover { background: rgba(255,255,255,0.25); }

/* Crop overlay */
.crop-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  cursor: crosshair;
}

.crop-dim {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.45);
  pointer-events: none;
}

.crop-selection {
  position: absolute;
  border: 2px dashed #fff;
  box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
  pointer-events: none;
}

.crop-selection .crop-size-label {
  position: absolute;
  bottom: -24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  color: #fff;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.crop-actions {
  position: absolute;
  bottom: -44px;
  right: 0;
  display: flex;
  gap: 6px;
  z-index: 21;
  pointer-events: auto;
}

.crop-actions button {
  padding: 5px 14px;
  border: none;
  border-radius: 6px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.12s;
}

.crop-actions .btn-crop-ok {
  background: var(--accent);
  color: #fff;
}

.crop-actions .btn-crop-ok:hover { background: var(--accent-hover); }

.crop-actions .btn-crop-cancel {
  background: rgba(255,255,255,0.2);
  color: #fff;
}

.crop-actions .btn-crop-cancel:hover { background: rgba(255,255,255,0.3); }

/* Export menu */
.export-menu {
  position: fixed;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  padding: 6px;
  z-index: 150;
  box-shadow: 0 8px 24px var(--shadow);
  min-width: 180px;
}

.export-menu button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 12px;
  border: none;
  background: transparent;
  color: var(--panel-text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.12s;
  text-align: left;
}

.export-menu button:hover {
  background: var(--accent);
  color: #fff;
}

.export-menu button svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  flex-shrink: 0;
}

.export-menu .menu-sep {
  height: 1px;
  background: var(--panel-border);
  margin: 4px 6px;
}

/* Voice status in right panel */
.voice-status {
  position: fixed;
  right: 72px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  padding: 10px 14px;
  z-index: 99;
  box-shadow: 0 4px 16px var(--shadow);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 500;
  color: var(--panel-text);
}

.voice-status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--danger);
  animation: pulse 1.2s ease-in-out infinite;
}

/* Gallery panel */
.gallery-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 320px;
  height: 100vh;
  background: var(--panel-bg);
  border-left: 1px solid var(--panel-border);
  z-index: 250;
  display: flex;
  flex-direction: column;
  box-shadow: -4px 0 24px var(--shadow);
  transform: translateX(100%);
  transition: transform 0.25s ease;
}

.gallery-panel.open {
  transform: translateX(0);
}

.gallery-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  border-bottom: 1px solid var(--panel-border);
  flex-shrink: 0;
}

.gallery-header h3 {
  font-size: 15px;
  font-weight: 600;
  color: var(--panel-text);
}

.gallery-header .gallery-count {
  font-size: 12px;
  color: var(--panel-text-muted);
  font-weight: 400;
  margin-left: 6px;
}

.gallery-header-actions {
  display: flex;
  gap: 4px;
}

.gallery-header-actions button {
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  color: var(--panel-text-muted);
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s, color 0.12s;
}

.gallery-header-actions button:hover {
  background: rgba(0,0,0,0.06);
  color: var(--panel-text);
}

.gallery-header-actions button svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
}

.gallery-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.gallery-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 10px;
  color: var(--panel-text-muted);
  font-size: 13px;
}

.gallery-empty svg {
  width: 40px;
  height: 40px;
  stroke: var(--panel-text-muted);
  fill: none;
  stroke-width: 1.5;
  opacity: 0.5;
}

.gallery-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.gallery-grid.size-small { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.gallery-grid.size-small .gallery-item { aspect-ratio: 1/1; }

.gallery-grid.size-large { grid-template-columns: 1fr; gap: 12px; }
.gallery-grid.size-large .gallery-item { aspect-ratio: 16/9; }

.gallery-size-btns {
  display: flex;
  gap: 2px;
  margin-right: 6px;
}

.gallery-size-btns button {
  width: 24px;
  height: 24px;
  border: none;
  background: transparent;
  color: var(--toolbar-text);
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  opacity: 0.5;
}

.gallery-size-btns button.active {
  opacity: 1;
  background: var(--accent);
  color: #fff;
}

.gallery-item {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--panel-border);
  background: var(--canvas-bg);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  aspect-ratio: 4/3;
}

.gallery-item:hover {
  border-color: var(--accent);
  box-shadow: 0 2px 8px var(--shadow);
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.gallery-item .gallery-item-info {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 4px 6px;
  background: linear-gradient(transparent, rgba(0,0,0,0.6));
  color: #fff;
  font-size: 10px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.gallery-item .gallery-item-delete {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 22px;
  height: 22px;
  border: none;
  background: rgba(0,0,0,0.5);
  color: #fff;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.15s;
  font-size: 14px;
  line-height: 1;
}

.gallery-item:hover .gallery-item-delete {
  opacity: 1;
}

.gallery-item .gallery-item-delete:hover {
  background: var(--danger);
}

@media (max-width: 600px) {
  .toolbar { left: 8px; padding: 6px; }
  .toolbar button { width: 36px; height: 36px; }
  .right-panel { right: 8px; padding: 6px; }
  .right-panel button { width: 36px; height: 36px; }
  .bottom-bar { padding: 6px 10px; gap: 8px; }
  .size-control input[type="range"] { width: 50px; }
  .opacity-control input[type="range"] { width: 40px; }
}

<script>
(function() {
  const $ = s => document.querySelector(s);
  const bgCanvas = $('#bg-canvas');
  const drawCanvas = $('#draw-canvas');
  const previewCanvas = $('#preview-canvas');
  const bgCtx = bgCanvas.getContext('2d');
  const drawCtx = drawCanvas.getContext('2d');
  const previewCtx = previewCanvas.getContext('2d');
  const wrapper = $('#canvasWrapper');
  const dropZone = $('#dropZone');
  const fileInput = $('#fileInput');
  const cursorPreview = $('#cursorPreview');

  let currentTool = 'pen';
  let currentColor = '#1C1F26';
  let brushSize = 4;
  let opacity = 1;
  let isDrawing = false;
  let lastX, lastY;
  let startX, startY;
  let imgW = 0, imgH = 0;
  let loadedImage = null;

  // History
  let drawHistory = [];
  let historyIndex = -1;
  const MAX_HISTORY = 40;

  function pushHistory() {
    historyIndex++;
    drawHistory.length = historyIndex;
    drawHistory.push(drawCanvas.toDataURL());
    if (drawHistory.length > MAX_HISTORY) {
      drawHistory.shift();
      historyIndex--;
    }
  }

  function undo() {
    if (historyIndex > 0) {
      historyIndex--;
      restoreHistory();
    }
  }

  function redo() {
    if (historyIndex < drawHistory.length - 1) {
      historyIndex++;
      restoreHistory();
    }
  }

  function restoreHistory() {
    const img = new Image();
    img.onload = () => {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      drawCtx.drawImage(img, 0, 0);
    };
    img.src = drawHistory[historyIndex];
  }

  // Toast
  let toastTimer;
  function showToast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  // Init blank canvas on startup
  function initBlankCanvas() {
    const w = Math.min(800, window.innerWidth - 160);
    const h = Math.min(600, window.innerHeight - 100);
    imgW = w; imgH = h;
    loadedImage = null;
    [bgCanvas, drawCanvas, previewCanvas].forEach(c => {
      c.width = w; c.height = h;
      c.style.width = w + 'px';
      c.style.height = h + 'px';
    });
    wrapper.style.width = w + 'px';
    wrapper.style.height = h + 'px';

    bgCtx.fillStyle = '#FFFFFF';
    bgCtx.fillRect(0, 0, w, h);
    drawCtx.clearRect(0, 0, w, h);
    previewCtx.clearRect(0, 0, w, h);

    dropZone.hidden = true;
    wrapper.hidden = false;

    drawHistory = [];
    historyIndex = -1;
    pushHistory();
  }

  initBlankCanvas();

  // Load image
  function loadImage(file) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        const maxW = window.innerWidth - 160;
        const maxH = window.innerHeight - 100;
        let w = img.naturalWidth;
        let h = img.naturalHeight;
        if (w > maxW || h > maxH) {
          const scale = Math.min(maxW / w, maxH / h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        imgW = w; imgH = h;
        [bgCanvas, drawCanvas, previewCanvas].forEach(c => {
          c.width = w; c.height = h;
          c.style.width = w + 'px';
          c.style.height = h + 'px';
        });
        wrapper.style.width = w + 'px';
        wrapper.style.height = h + 'px';

        bgCtx.drawImage(img, 0, 0, w, h);
        drawCtx.clearRect(0, 0, w, h);
        previewCtx.clearRect(0, 0, w, h);

        dropZone.hidden = true;
        wrapper.hidden = false;

        drawHistory = [];
        historyIndex = -1;
        pushHistory();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // File input
  $('#fileBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) loadImage(e.target.files[0]);
  });

  // Drag and drop
  const canvasArea = $('#canvasArea');
  canvasArea.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  canvasArea.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  canvasArea.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadImage(file);
  });

  // Tool selection
  document.querySelectorAll('[data-tool]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTool = btn.dataset.tool;
      wrapper.style.cursor = currentTool === 'text' ? 'text' : 'crosshair';
    });
  });

  // Actions
  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', e => {
      const action = btn.dataset.action;
      if (action === 'undo') undo();
      else if (action === 'redo') redo();
      else if (action === 'clear') {
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        pushHistory();
      }
      else if (action === 'newimage') {
        fileInput.value = '';
        fileInput.click();
      }
      else if (action === 'screenshot') takeScreenshot();
      else if (action === 'crop') startTrimMode();
      else if (action === 'zoomin') zoomCanvas(0.25);
      else if (action === 'zoomout') zoomCanvas(-0.25);
      else if (action === 'zoomreset') zoomCanvas(0, true);
      else if (action === 'resetcanvas') {
        initBlankCanvas();
        currentZoom = 1;
        wrapper.style.transform = 'scale(1)';
        showToast('白紙に戻しました');
      }
      else if (action === 'copy') copyToClipboard();
      else if (action === 'export') showExportMenu(btn);
      else if (action === 'gallery') toggleGallery();
      else if (action === 'voice') startVoiceToCanvas();
    });
  });

  // Color
  document.querySelectorAll('.color-swatch').forEach(s => {
    s.addEventListener('click', () => {
      document.querySelectorAll('.color-swatch').forEach(x => x.classList.remove('active'));
      s.classList.add('active');
      currentColor = s.dataset.color;
      $('#customColor').value = currentColor;
    });
  });

  $('#customColor').addEventListener('input', e => {
    currentColor = e.target.value;
    document.querySelectorAll('.color-swatch').forEach(x => x.classList.remove('active'));
  });

  // Size
  $('#brushSize').addEventListener('input', e => {
    brushSize = parseInt(e.target.value);
    $('#sizeLabel').textContent = brushSize + 'px';
  });

  // Opacity
  $('#opacityRange').addEventListener('input', e => {
    opacity = parseInt(e.target.value) / 100;
    $('#opacityLabel').textContent = e.target.value + '%';
  });

  // ---- Paper size switching ----
  let currentPaper = 'free';
  let currentOrient = 'portrait';

  document.querySelectorAll('.paper-btn[data-paper]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.paper-btn[data-paper]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const paper = btn.dataset.paper;
      currentPaper = paper;
      applyPaperSize(paper);
    });
  });

  document.querySelectorAll('.orient-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.orient-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentOrient = btn.dataset.orient;
      if (currentPaper !== 'free') {
        applyPaperSize(currentPaper);
      }
    });
  });

  function applyPaperSize(paper) {
    if (paper === 'free') return;

    const dpi = 96;
    const mmToPx = dpi / 25.4;
    const sizes = { a4: [210, 297], a3: [297, 420] };
    let [wMm, hMm] = sizes[paper];
    if (currentOrient === 'landscape') { [wMm, hMm] = [hMm, wMm]; }
    const newW = Math.round(wMm * mmToPx);
    const newH = Math.round(hMm * mmToPx);

    const oldMerged = getMergedCanvas();

    imgW = newW; imgH = newH;
    [bgCanvas, drawCanvas, previewCanvas].forEach(c => {
      c.width = newW; c.height = newH;
      c.style.width = newW + 'px';
      c.style.height = newH + 'px';
    });
    wrapper.style.width = newW + 'px';
    wrapper.style.height = newH + 'px';

    bgCtx.fillStyle = '#FFFFFF';
    bgCtx.fillRect(0, 0, newW, newH);

    const ox = Math.round((newW - oldMerged.width) / 2);
    const oy = Math.round((newH - oldMerged.height) / 2);
    bgCtx.drawImage(oldMerged, ox, oy);

    drawCtx.clearRect(0, 0, newW, newH);
    previewCtx.clearRect(0, 0, newW, newH);

    drawHistory = [];
    historyIndex = -1;
    pushHistory();

    const maxScale = Math.min(
      (window.innerWidth - 160) / newW,
      (window.innerHeight - 100) / newH,
      1
    );
    if (maxScale < 1) {
      currentZoom = Math.round(maxScale * 100) / 100;
      wrapper.style.transform = `scale(${currentZoom})`;
    }

    showToast(`用紙サイズ: ${paper.toUpperCase()} ${currentOrient === 'landscape' ? '横' : '縦'}`);
  }

  // ---- Zoom ----
  let currentZoom = 1;
  let zoomIndicatorTimer;

  function zoomCanvas(delta, reset) {
    if (wrapper.hidden) return;
    if (reset) { currentZoom = 1; }
    else { currentZoom = Math.max(0.25, Math.min(4, currentZoom + delta)); }
    wrapper.style.transform = `scale(${currentZoom})`;

    const zi = $('#zoomIndicator');
    zi.textContent = `${Math.round(currentZoom * 100)}%`;
    zi.classList.add('show');
    clearTimeout(zoomIndicatorTimer);
    zoomIndicatorTimer = setTimeout(() => zi.classList.remove('show'), 1200);
  }

  canvasArea.addEventListener('wheel', e => {
    if (wrapper.hidden) return;
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.1 : 0.1;
      zoomCanvas(delta);
    }
  }, { passive: false });

  // ---- Trim mode ----
  function startTrimMode() {
    if (wrapper.hidden) return;
    startCropMode(true);
  }

  // ---- Screenshot ----
  function takeScreenshot() {
    if (wrapper.hidden) return;
    startCropMode(false);
  }

  // ---- Crop / Region select mode ----
  let cropOverlay = null;

  function startCropMode(isCropOnly) {
    if (cropOverlay) cropOverlay.remove();

    wrapper.style.overflow = 'visible';

    const ov = document.createElement('div');
    ov.className = 'crop-overlay';
    wrapper.appendChild(ov);
    cropOverlay = ov;

    let sx, sy, cx, cy, isDragging = false, selEl = null;

    function updateSel() {
      const x = Math.min(sx, cx);
      const y = Math.min(sy, cy);
      const w = Math.abs(cx - sx);
      const h = Math.abs(cy - sy);
      if (!selEl) {
        selEl = document.createElement('div');
        selEl.className = 'crop-selection';
        selEl.innerHTML = '<span class="crop-size-label"></span>';
        ov.appendChild(selEl);
      }
      selEl.style.left = x + 'px';
      selEl.style.top = y + 'px';
      selEl.style.width = w + 'px';
      selEl.style.height = h + 'px';
      selEl.querySelector('.crop-size-label').textContent = `${Math.round(w)} x ${Math.round(h)}`;
    }

    function showCropActions() {
      selEl.style.pointerEvents = 'auto';
      selEl.addEventListener('mousedown', e => e.stopPropagation());
      selEl.addEventListener('touchstart', e => e.stopPropagation());
      const acts = document.createElement('div');
      acts.className = 'crop-actions';

      if (isCropOnly) {
        const trimBtn = document.createElement('button');
        trimBtn.className = 'btn-crop-ok';
        trimBtn.textContent = 'トリミング適用';
        trimBtn.addEventListener('click', () => {
          const x = Math.round(Math.min(sx, cx));
          const y = Math.round(Math.min(sy, cy));
          const w = Math.round(Math.abs(cx - sx));
          const h = Math.round(Math.abs(cy - sy));
          if (w < 2 || h < 2) { cleanupCrop(); return; }
          applyTrim(x, y, w, h);
          cleanupCrop();
        });
        acts.appendChild(trimBtn);
      } else {
        const okBtn = document.createElement('button');
        okBtn.className = 'btn-crop-ok';
        okBtn.textContent = '切り取り';
        okBtn.addEventListener('click', () => {
          const x = Math.min(sx, cx);
          const y = Math.min(sy, cy);
          const w = Math.abs(cx - sx);
          const h = Math.abs(cy - sy);
          if (w < 2 || h < 2) { cleanupCrop(); return; }
          captureCropRegion(x, y, w, h);
          cleanupCrop();
        });
        acts.appendChild(okBtn);

        const fullBtn = document.createElement('button');
        fullBtn.className = 'btn-crop-cancel';
        fullBtn.textContent = '全体';
        fullBtn.addEventListener('click', () => {
          cleanupCrop();
          const c = getMergedCanvas();
          showSaveOverlay(c.toDataURL('image/png'), 'png', false);
        });
        acts.appendChild(fullBtn);
      }

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn-crop-cancel';
      cancelBtn.textContent = 'キャンセル';
      cancelBtn.addEventListener('click', cleanupCrop);
      acts.appendChild(cancelBtn);

      selEl.appendChild(acts);
    }

    ov.addEventListener('mousedown', e => {
      e.preventDefault();
      const rect = ov.getBoundingClientRect();
      sx = (e.clientX - rect.left) / currentZoom;
      sy = (e.clientY - rect.top) / currentZoom;
      cx = sx; cy = sy;
      isDragging = true;
      if (selEl) { selEl.remove(); selEl = null; }
    });

    ov.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const rect = ov.getBoundingClientRect();
      cx = Math.max(0, Math.min((e.clientX - rect.left) / currentZoom, imgW));
      cy = Math.max(0, Math.min((e.clientY - rect.top) / currentZoom, imgH));
      updateSel();
    });

    ov.addEventListener('mouseup', e => {
      if (!isDragging) return;
      isDragging = false;
      const w = Math.abs(cx - sx);
      const h = Math.abs(cy - sy);
      if (w < 4 || h < 4) {
        cleanupCrop();
        if (!isCropOnly) {
          const c = getMergedCanvas();
          showSaveOverlay(c.toDataURL('image/png'), 'png', false);
        }
        return;
      }
      showCropActions();
    });

    ov.addEventListener('touchstart', e => {
      e.preventDefault();
      const rect = ov.getBoundingClientRect();
      const t = e.touches[0];
      sx = (t.clientX - rect.left) / currentZoom;
      sy = (t.clientY - rect.top) / currentZoom;
      cx = sx; cy = sy;
      isDragging = true;
      if (selEl) { selEl.remove(); selEl = null; }
    }, { passive: false });

    ov.addEventListener('touchmove', e => {
      if (!isDragging) return;
      e.preventDefault();
      const rect = ov.getBoundingClientRect();
      const t = e.touches[0];
      cx = Math.max(0, Math.min((t.clientX - rect.left) / currentZoom, imgW));
      cy = Math.max(0, Math.min((t.clientY - rect.top) / currentZoom, imgH));
      updateSel();
    }, { passive: false });

    ov.addEventListener('touchend', e => {
      if (!isDragging) return;
      isDragging = false;
      const w = Math.abs(cx - sx);
      const h = Math.abs(cy - sy);
      if (w < 4 || h < 4) {
        cleanupCrop();
        if (!isCropOnly) {
          const c = getMergedCanvas();
          showSaveOverlay(c.toDataURL('image/png'), 'png', false);
        }
        return;
      }
      showCropActions();
    });

    document.addEventListener('keydown', onCropEsc);
    showToast('範囲をドラッグで選択（クリックで全体）');
  }

  function onCropEsc(e) {
    if (e.key === 'Escape') cleanupCrop();
  }

  function cleanupCrop() {
    if (cropOverlay) { cropOverlay.remove(); cropOverlay = null; }
    wrapper.style.overflow = 'hidden';
    document.removeEventListener('keydown', onCropEsc);
  }

  function captureCropRegion(x, y, w, h) {
    const merged = getMergedCanvas();
    const cropC = document.createElement('canvas');
    cropC.width = Math.round(w);
    cropC.height = Math.round(h);
    const cropCtx = cropC.getContext('2d');
    cropCtx.drawImage(merged, Math.round(x), Math.round(y), Math.round(w), Math.round(h), 0, 0, Math.round(w), Math.round(h));
    const dataUrl = cropC.toDataURL('image/png');
    showSaveOverlay(dataUrl, 'png', false);
  }

  function applyTrim(x, y, w, h) {
    try {
      const tmpBg = document.createElement('canvas');
      tmpBg.width = w; tmpBg.height = h;
      tmpBg.getContext('2d').drawImage(bgCanvas, x, y, w, h, 0, 0, w, h);

      const tmpDraw = document.createElement('canvas');
      tmpDraw.width = w; tmpDraw.height = h;
      tmpDraw.getContext('2d').drawImage(drawCanvas, x, y, w, h, 0, 0, w, h);

      imgW = w; imgH = h;
      [bgCanvas, drawCanvas, previewCanvas].forEach(c => {
        c.width = w; c.height = h;
        c.style.width = w + 'px';
        c.style.height = h + 'px';
      });
      wrapper.style.width = w + 'px';
      wrapper.style.height = h + 'px';

      bgCtx.drawImage(tmpBg, 0, 0);
      drawCtx.drawImage(tmpDraw, 0, 0);
      previewCtx.clearRect(0, 0, w, h);

      currentZoom = 1;
      wrapper.style.transform = 'scale(1)';

      drawHistory = [];
      historyIndex = -1;
      pushHistory();
      showToast('トリミングしました');
    } catch (err) {
      showToast('トリミングに失敗しました');
    }
  }

  // ---- Merge canvas helper ----
  function getMergedCanvas() {
    const c = document.createElement('canvas');
    c.width = imgW;
    c.height = imgH;
    const ctx = c.getContext('2d');
    ctx.drawImage(bgCanvas, 0, 0);
    ctx.drawImage(drawCanvas, 0, 0);
    return c;
  }

  // ---- Copy to clipboard ----
  async function copyToClipboard() {
    if (wrapper.hidden) return;
    const c = getMergedCanvas();
    const dataUrl = c.toDataURL('image/png');

    try {
      const blob = await new Promise(resolve => c.toBlob(resolve, 'image/png'));
      if (blob && navigator.clipboard && navigator.clipboard.write) {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        showToast('クリップボードにコピーしました');
        return;
      }
    } catch (err) {}

    showSaveOverlay(dataUrl, 'png', true);
  }

  // ---- Save overlay (works everywhere) ----
  function showSaveOverlay(dataUrl, ext, isCopy) {
    const existing = document.querySelector('.save-overlay');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.className = 'save-overlay';

    const img = document.createElement('img');
    img.src = dataUrl;

    const hint = document.createElement('div');
    hint.className = 'save-hint';
    if (isCopy) {
      hint.innerHTML = '画像を右クリック →「画像をコピー」でコピーできます<br>または「名前を付けて画像を保存」で保存';
    } else {
      hint.innerHTML = '画像を右クリック →「名前を付けて画像を保存」<br>で保存してください';
    }

    const actions = document.createElement('div');
    actions.className = 'save-actions';

    const dlBtn = document.createElement('button');
    dlBtn.className = 'btn-download';
    dlBtn.textContent = 'ダウンロード試行';
    dlBtn.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `rakugaki_${Date.now()}.${ext}`;
      a.click();
    });

    const galBtn = document.createElement('button');
    galBtn.className = 'btn-download';
    galBtn.textContent = 'ギャラリーに保存';
    galBtn.addEventListener('click', () => {
      addToGallery(dataUrl);
      showToast('ギャラリーに保存しました');
    });

    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn-close-overlay';
    closeBtn.textContent = '閉じる';
    closeBtn.addEventListener('click', () => overlay.remove());

    actions.appendChild(dlBtn);
    actions.appendChild(galBtn);
    actions.appendChild(closeBtn);
    overlay.appendChild(img);
    overlay.appendChild(hint);
    overlay.appendChild(actions);
    document.body.appendChild(overlay);

    overlay.addEventListener('click', e => {
      if (e.target === overlay) overlay.remove();
    });
  }

  // ---- Export menu ----
  let exportMenuEl = null;

  function showExportMenu(anchorBtn) {
    closeExportMenu();
    const menu = document.createElement('div');
    menu.className = 'export-menu';
    menu.innerHTML = `
      <button data-export="png"><svg viewBox="0 0 24 24"><path d="M12 15V3m0 12l-4-4m4 4l4-4"/><path d="M2 17l.62 2.48A2 2 0 004.56 21h14.88a2 2 0 001.94-1.52L22 17"/></svg>PNG で保存</button>
      <button data-export="jpg"><svg viewBox="0 0 24 24"><path d="M12 15V3m0 12l-4-4m4 4l4-4"/><path d="M2 17l.62 2.48A2 2 0 004.56 21h14.88a2 2 0 001.94-1.52L22 17"/></svg>JPG で保存</button>
      <button data-export="pdf-auto"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>PDF (原寸)</button>
      <button data-export="pdf-a4"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>PDF (A4)</button>
      <button data-export="pdf-a3"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>PDF (A3)</button>
      <div class="menu-sep"></div>
      <button data-export="copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>クリップボードにコピー</button>
    `;
    const rect = anchorBtn.getBoundingClientRect();
    menu.style.right = (window.innerWidth - rect.left + 8) + 'px';
    menu.style.top = rect.top + 'px';
    document.body.appendChild(menu);
    exportMenuEl = menu;

    menu.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const fmt = btn.dataset.export;
        if (fmt === 'png') saveAs('png');
        else if (fmt === 'jpg') saveAs('jpg');
        else if (fmt === 'pdf-auto') saveAsPDF('auto');
        else if (fmt === 'pdf-a4') saveAsPDF('a4');
        else if (fmt === 'pdf-a3') saveAsPDF('a3');
        else if (fmt === 'copy') copyToClipboard();
        closeExportMenu();
      });
    });

    setTimeout(() => {
      document.addEventListener('click', onClickOutsideMenu);
    }, 0);
  }

  function closeExportMenu() {
    if (exportMenuEl) {
      exportMenuEl.remove();
      exportMenuEl = null;
      document.removeEventListener('click', onClickOutsideMenu);
    }
  }

  function onClickOutsideMenu(e) {
    if (exportMenuEl && !exportMenuEl.contains(e.target)) {
      closeExportMenu();
    }
  }

  // ---- Save as PNG / JPG ----
  function saveAs(format) {
    if (wrapper.hidden) return;
    const c = getMergedCanvas();
    let targetCanvas = c;

    if (format === 'jpg') {
      const jc = document.createElement('canvas');
      jc.width = imgW; jc.height = imgH;
      const jctx = jc.getContext('2d');
      jctx.fillStyle = '#FFFFFF';
      jctx.fillRect(0, 0, imgW, imgH);
      jctx.drawImage(c, 0, 0);
      targetCanvas = jc;
    }

    const mime = format === 'jpg' ? 'image/jpeg' : 'image/png';
    const ext = format === 'jpg' ? 'jpg' : 'png';
    const dataUrl = targetCanvas.toDataURL(mime, 0.92);

    showSaveOverlay(dataUrl, ext, false);
  }

  // ---- Save as PDF ----
  function saveAsPDF(paperSize) {
    if (wrapper.hidden) return;
    if (!paperSize || paperSize === 'auto') {
      paperSize = currentPaper !== 'free' ? currentPaper : 'auto';
    }
    try {
      const { jsPDF } = window.jspdf;
      const c = getMergedCanvas();
      const dataUrl = c.toDataURL('image/jpeg', 0.92);

      const pxToMm = 0.264583;
      const wMm = imgW * pxToMm;
      const hMm = imgH * pxToMm;

      let pdf, drawW, drawH, drawX, drawY;

      if (paperSize === 'a4' || paperSize === 'a3') {
        const sizes = { a4: [210, 297], a3: [297, 420] };
        const [pw, ph] = sizes[paperSize];
        const orientation = currentOrient === 'landscape' ? 'l' : 'p';
        const pageW = orientation === 'l' ? ph : pw;
        const pageH = orientation === 'l' ? pw : ph;

        const margin = 10;
        const maxW = pageW - margin * 2;
        const maxH = pageH - margin * 2;
        const scale = Math.min(maxW / wMm, maxH / hMm, 1);
        drawW = wMm * scale;
        drawH = hMm * scale;
        drawX = (pageW - drawW) / 2;
        drawY = (pageH - drawH) / 2;

        pdf = new jsPDF({ orientation, unit: 'mm', format: paperSize });
        pdf.addImage(dataUrl, 'JPEG', drawX, drawY, drawW, drawH);
      } else {
        const orientation = wMm > hMm ? 'l' : 'p';
        pdf = new jsPDF({ orientation, unit: 'mm', format: [wMm, hMm] });
        pdf.addImage(dataUrl, 'JPEG', 0, 0, wMm, hMm);
      }

      const pdfDataUri = pdf.output('datauristring');
      showSaveOverlay(dataUrl, 'png', false);
      const a = document.createElement('a');
      a.href = pdfDataUri;
      a.download = `rakugaki_${paperSize || 'auto'}_${Date.now()}.pdf`;
      a.click();
      showToast(`PDF (${paperSize === 'a4' ? 'A4' : paperSize === 'a3' ? 'A3' : '原寸'}) を出力しました`);
    } catch (err) {
      const c = getMergedCanvas();
      showSaveOverlay(c.toDataURL('image/png'), 'png', false);
    }
  }

  // ---- Voice input (Web Speech API) ----
  let voiceRecognition = null;
  let isVoiceRecording = false;

  function startVoiceToCanvas() {
    if (wrapper.hidden) {
      showToast('先に画像を読み込んでください');
      return;
    }

    if (isVoiceRecording) {
      stopVoice();
      return;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      showToast('このブラウザは音声入力に対応していません');
      return;
    }

    voiceRecognition = new SpeechRecognition();
    voiceRecognition.lang = 'ja-JP';
    voiceRecognition.continuous = true;
    voiceRecognition.interimResults = true;

    isVoiceRecording = true;
    const voiceBtn = $('#voiceBtn');
    voiceBtn.classList.add('recording');

    const statusEl = document.createElement('div');
    statusEl.className = 'voice-status';
    statusEl.id = 'voiceStatus';
    const btnRect = voiceBtn.getBoundingClientRect();
    statusEl.style.top = btnRect.top + 'px';
    statusEl.innerHTML = '<span class="dot"></span>音声入力中... クリックで画像に配置';
    document.body.appendChild(statusEl);

    let fullText = '';
    let interimText = '';

    voiceRecognition.onresult = (event) => {
      let interim = '';
      let final = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          final += event.results[i][0].transcript;
        } else {
          interim += event.results[i][0].transcript;
        }
      }
      if (final) fullText += final;
      interimText = interim;

      const display = fullText + interimText;
      if (display) {
        statusEl.innerHTML = `<span class="dot"></span>${display.slice(-30)}${display.length > 30 ? '...' : ''}`;
      }
    };

    voiceRecognition.onerror = (event) => {
      if (event.error !== 'no-speech') {
        showToast('音声認識エラー: ' + event.error);
      }
      stopVoice();
    };

    voiceRecognition.onend = () => {
      if (isVoiceRecording) {
        const text = (fullText + interimText).trim();
        if (text) {
          placeTextOnCanvas(text);
        }
        stopVoice();
      }
    };

    voiceRecognition.start();
    showToast('話してください...');

    const stopOnClick = () => {
      if (isVoiceRecording) {
        const text = (fullText + interimText).trim();
        voiceRecognition.stop();
        isVoiceRecording = false;
        if (text) placeTextOnCanvas(text);
        stopVoice();
      }
      voiceBtn.removeEventListener('click', stopOnClick);
    };

    setTimeout(() => {
      voiceBtn.addEventListener('click', stopOnClick);
    }, 100);
  }

  function stopVoice() {
    isVoiceRecording = false;
    const voiceBtn = $('#voiceBtn');
    voiceBtn.classList.remove('recording');
    const status = $('#voiceStatus');
    if (status) status.remove();
    if (voiceRecognition) {
      try { voiceRecognition.stop(); } catch(e) {}
      voiceRecognition = null;
    }
  }

  function placeTextOnCanvas(text) {
    const cx = imgW / 2;
    const cy = imgH / 2;
    const fontSize = Math.max(brushSize * 3, 18);

    drawCtx.globalCompositeOperation = 'source-over';
    drawCtx.font = `600 ${fontSize}px 'Noto Sans JP', 'DM Sans', system-ui, sans-serif`;
    drawCtx.fillStyle = currentColor;
    drawCtx.globalAlpha = opacity;
    drawCtx.textAlign = 'center';
    drawCtx.textBaseline = 'middle';

    const maxWidth = imgW * 0.8;
    const lines = wrapText(drawCtx, text, maxWidth);
    const lineHeight = fontSize * 1.4;
    const totalH = lines.length * lineHeight;
    const startY = cy - totalH / 2 + lineHeight / 2;

    lines.forEach((line, i) => {
      drawCtx.fillText(line, cx, startY + i * lineHeight);
    });

    drawCtx.textAlign = 'start';
    drawCtx.textBaseline = 'alphabetic';
    drawCtx.globalAlpha = 1;
    pushHistory();
    showToast('テキストを配置しました');
  }

  function wrapText(ctx, text, maxWidth) {
    const chars = text.split('');
    const lines = [];
    let currentLine = '';

    for (const char of chars) {
      const testLine = currentLine + char;
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && currentLine.length > 0) {
        lines.push(currentLine);
        currentLine = char;
      } else {
        currentLine = testLine;
      }
    }
    if (currentLine) lines.push(currentLine);
    return lines;
  }

  // Drawing
  function getPos(e) {
    const rect = drawCanvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const scaleX = drawCanvas.width / rect.width;
    const scaleY = drawCanvas.height / rect.height;
    return [(clientX - rect.left) * scaleX, (clientY - rect.top) * scaleY];
  }

  function setupStroke(ctx) {
    ctx.strokeStyle = currentColor;
    ctx.fillStyle = currentColor;
    ctx.lineWidth = brushSize;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = opacity;
    if (currentTool === 'marker') {
      ctx.globalAlpha = opacity * 0.4;
      ctx.lineWidth = brushSize * 2.5;
    }
  }

  function startDraw(e) {
    if (wrapper.hidden) return;
    if (currentTool === 'text') return handleText(e);

    isDrawing = true;
    [lastX, lastY] = getPos(e);
    [startX, startY] = [lastX, lastY];

    if (currentTool === 'pen' || currentTool === 'marker' || currentTool === 'eraser') {
      drawCtx.beginPath();
      if (currentTool === 'eraser') {
        drawCtx.globalCompositeOperation = 'destination-out';
      } else {
        drawCtx.globalCompositeOperation = 'source-over';
      }
      setupStroke(drawCtx);
      drawCtx.moveTo(lastX, lastY);
      drawCtx.lineTo(lastX + 0.1, lastY + 0.1);
      drawCtx.stroke();
    }
  }

  function moveDraw(e) {
    if (!isDrawing) return;
    e.preventDefault();
    const [x, y] = getPos(e);

    if (currentTool === 'pen' || currentTool === 'marker' || currentTool === 'eraser') {
      if (currentTool === 'eraser') {
        drawCtx.globalCompositeOperation = 'destination-out';
      }
      setupStroke(drawCtx);
      drawCtx.beginPath();
      drawCtx.moveTo(lastX, lastY);
      drawCtx.lineTo(x, y);
      drawCtx.stroke();
      [lastX, lastY] = [x, y];
    } else {
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      setupStroke(previewCtx);
      previewCtx.globalCompositeOperation = 'source-over';
      drawShape(previewCtx, startX, startY, x, y);
    }
  }

  function endDraw(e) {
    if (!isDrawing) return;
    isDrawing = false;

    if (currentTool !== 'pen' && currentTool !== 'marker' && currentTool !== 'eraser') {
      let ex, ey;
      if (e.changedTouches) {
        const rect = drawCanvas.getBoundingClientRect();
        const scaleX = drawCanvas.width / rect.width;
        const scaleY = drawCanvas.height / rect.height;
        ex = (e.changedTouches[0].clientX - rect.left) * scaleX;
        ey = (e.changedTouches[0].clientY - rect.top) * scaleY;
      } else {
        [ex, ey] = getPos(e);
      }
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      setupStroke(drawCtx);
      drawCtx.globalCompositeOperation = 'source-over';
      drawShape(drawCtx, startX, startY, ex, ey);
    }

    drawCtx.globalCompositeOperation = 'source-over';
    drawCtx.globalAlpha = 1;
    pushHistory();
  }

  function drawShape(ctx, x1, y1, x2, y2) {
    ctx.beginPath();
    if (currentTool === 'line') {
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    } else if (currentTool === 'arrow') {
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const headLen = Math.max(brushSize * 3, 12);
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
      ctx.stroke();
    } else if (currentTool === 'rect') {
      ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    } else if (currentTool === 'circle') {
      const rx = Math.abs(x2 - x1) / 2;
      const ry = Math.abs(y2 - y1) / 2;
      const cx = (x1 + x2) / 2;
      const cy = (y1 + y2) / 2;
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Text tool
  function handleText(e) {
    const [x, y] = getPos(e);
    const existing = wrapper.querySelector('.text-input-overlay');
    if (existing) {
      commitText(existing);
      return;
    }
    const div = document.createElement('div');
    div.className = 'text-input-overlay';
    div.style.left = x + 'px';
    div.style.top = y + 'px';

    const fontSize = Math.max(brushSize * 2, 14);

    const ta = document.createElement('textarea');
    ta.style.fontSize = fontSize + 'px';
    ta.style.color = currentColor;
    ta.placeholder = 'テキストを入力...';

    const toolbar = document.createElement('div');
    toolbar.className = 'text-toolbar';

    const sizeSelect = document.createElement('select');
    [12, 16, 20, 24, 32, 48, 64].forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s + 'px';
      if (s === fontSize || (fontSize < 16 && s === 16)) opt.selected = true;
      sizeSelect.appendChild(opt);
    });
    sizeSelect.addEventListener('change', () => {
      ta.style.fontSize = sizeSelect.value + 'px';
    });

    const micBtn = document.createElement('button');
    micBtn.className = 'btn-mic';
    micBtn.title = '音声入力';
    micBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="1" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="17" x2="12" y2="21"/></svg>';

    let textVoiceRec = null;
    micBtn.addEventListener('click', () => {
      if (textVoiceRec) {
        textVoiceRec.stop();
        textVoiceRec = null;
        micBtn.classList.remove('recording');
        return;
      }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { showToast('音声入力非対応'); return; }
      textVoiceRec = new SR();
      textVoiceRec.lang = 'ja-JP';
      textVoiceRec.continuous = true;
      textVoiceRec.interimResults = true;
      micBtn.classList.add('recording');

      let baseText = ta.value;
      textVoiceRec.onresult = (ev) => {
        let interim = '';
        let final = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          if (ev.results[i].isFinal) final += ev.results[i][0].transcript;
          else interim += ev.results[i][0].transcript;
        }
        if (final) baseText += final;
        ta.value = baseText + interim;
      };
      textVoiceRec.onend = () => {
        micBtn.classList.remove('recording');
        textVoiceRec = null;
      };
      textVoiceRec.onerror = () => {
        micBtn.classList.remove('recording');
        textVoiceRec = null;
      };
      textVoiceRec.start();
    });

    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'btn-confirm';
    confirmBtn.textContent = '確定';
    confirmBtn.addEventListener('click', () => commitText(div));

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-cancel';
    cancelBtn.textContent = '取消';
    cancelBtn.addEventListener('click', () => {
      if (textVoiceRec) { textVoiceRec.stop(); textVoiceRec = null; }
      div.remove();
    });

    toolbar.appendChild(sizeSelect);
    toolbar.appendChild(micBtn);
    toolbar.appendChild(confirmBtn);
    toolbar.appendChild(cancelBtn);

    div.appendChild(ta);
    div.appendChild(toolbar);
    wrapper.appendChild(div);
    ta.focus();

    ta.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' && !ev.shiftKey) {
        ev.preventDefault();
        commitText(div);
      }
      if (ev.key === 'Escape') {
        if (textVoiceRec) { textVoiceRec.stop(); textVoiceRec = null; }
        div.remove();
      }
    });
  }

  function commitText(div) {
    const ta = div.querySelector('textarea');
    const text = ta.value.trim();
    if (text) {
      const x = parseInt(div.style.left);
      const y = parseInt(div.style.top);
      const fontSize = parseInt(ta.style.fontSize);
      drawCtx.globalCompositeOperation = 'source-over';
      drawCtx.font = `500 ${fontSize}px 'Noto Sans JP', 'DM Sans', system-ui, sans-serif`;
      drawCtx.fillStyle = currentColor;
      drawCtx.globalAlpha = opacity;
      const lines = text.split('\n');
      lines.forEach((line, i) => {
        drawCtx.fillText(line, x + 6, y + fontSize + (i * fontSize * 1.4));
      });
      drawCtx.globalAlpha = 1;
      pushHistory();
    }
    div.remove();
  }

  // Canvas events
  drawCanvas.addEventListener('mousedown', startDraw);
  drawCanvas.addEventListener('mousemove', moveDraw);
  drawCanvas.addEventListener('mouseup', endDraw);
  drawCanvas.addEventListener('mouseleave', e => { if (isDrawing) endDraw(e); });
  drawCanvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e); }, { passive: false });
  drawCanvas.addEventListener('touchmove', e => { e.preventDefault(); moveDraw(e); }, { passive: false });
  drawCanvas.addEventListener('touchend', e => { e.preventDefault(); endDraw(e); });

  // Cursor preview
  canvasArea.addEventListener('mousemove', e => {
    if (wrapper.hidden) return;
    const size = currentTool === 'marker' ? brushSize * 2.5 : brushSize;
    cursorPreview.style.display = 'block';
    cursorPreview.style.width = size + 'px';
    cursorPreview.style.height = size + 'px';
    cursorPreview.style.left = (e.clientX - size / 2) + 'px';
    cursorPreview.style.top = (e.clientY - size / 2) + 'px';
  });
  canvasArea.addEventListener('mouseleave', () => {
    cursorPreview.style.display = 'none';
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) { e.preventDefault(); redo(); }
    else if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveAs('png'); }
    else if ((e.ctrlKey || e.metaKey) && e.key === 'c' && !window.getSelection().toString()) { e.preventDefault(); copyToClipboard(); }
    else if (e.key === 'b') clickTool('pen');
    else if (e.key === 'm') clickTool('marker');
    else if (e.key === 'e') clickTool('eraser');
    else if (e.key === 'l') clickTool('line');
    else if (e.key === 'r') clickTool('rect');
    else if (e.key === 'c' && !e.ctrlKey && !e.metaKey) clickTool('circle');
    else if (e.key === 'a') clickTool('arrow');
    else if (e.key === 't') clickTool('text');
    else if (e.key === '[') {
      brushSize = Math.max(1, brushSize - 2);
      $('#brushSize').value = brushSize;
      $('#sizeLabel').textContent = brushSize + 'px';
    }
    else if (e.key === ']') {
      brushSize = Math.min(50, brushSize + 2);
      $('#brushSize').value = brushSize;
      $('#sizeLabel').textContent = brushSize + 'px';
    }
    else if (e.key === '+' || e.key === '=') { zoomCanvas(0.25); }
    else if (e.key === '-') { zoomCanvas(-0.25); }
    else if (e.key === '0') { zoomCanvas(0, true); }
  });

  function clickTool(name) {
    const btn = document.querySelector(`[data-tool="${name}"]`);
    if (btn) btn.click();
  }

  // ---- Gallery (saved images storage) ----
  const GALLERY_KEY = 'rakugaki_gallery';
  const MAX_GALLERY = 50;
  let memoryGallery = [];
  let useLocalStorage = true;

  try { localStorage.getItem(GALLERY_KEY); } catch(e) { useLocalStorage = false; }

  function getGalleryItems() {
    if (!useLocalStorage) return memoryGallery;
    try {
      return JSON.parse(localStorage.getItem(GALLERY_KEY) || '[]');
    } catch(e) { return memoryGallery; }
  }

  function saveGalleryItems(items) {
    memoryGallery = items;
    if (!useLocalStorage) return;
    try {
      localStorage.setItem(GALLERY_KEY, JSON.stringify(items));
    } catch(e) {
      showToast('保存容量の上限に達しました');
    }
  }

  function addToGallery(dataUrl) {
    const items = getGalleryItems();
    const now = new Date();
    const label = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

    const thumb = createThumbnail(dataUrl, 300);
    thumb.then(thumbUrl => {
      items.unshift({ id: Date.now(), thumb: thumbUrl, full: dataUrl, date: label });
      if (items.length > MAX_GALLERY) items.length = MAX_GALLERY;
      saveGalleryItems(items);
      updateGalleryBadge();
      if ($('#galleryPanel').classList.contains('open')) renderGallery();
    });
  }

  function createThumbnail(dataUrl, maxSize) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) {
          const s = Math.min(maxSize / w, maxSize / h);
          w = Math.round(w * s);
          h = Math.round(h * s);
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }

  function toggleGallery() {
    const panel = $('#galleryPanel');
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) renderGallery();
  }

  function renderGallery() {
    const body = $('#galleryBody');
    const items = getGalleryItems();
    $('#galleryCount').textContent = items.length ? `(${items.length})` : '';

    if (items.length === 0) {
      body.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'gallery-empty';
      empty.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>保存した画像がありません</span>';
      body.appendChild(empty);
      return;
    }

    body.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'gallery-grid size-' + gallerySize;

    items.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'gallery-item';

      const img = document.createElement('img');
      img.src = item.thumb || item.full;
      img.loading = 'lazy';

      const info = document.createElement('div');
      info.className = 'gallery-item-info';
      info.textContent = item.date;

      const del = document.createElement('button');
      del.className = 'gallery-item-delete';
      del.textContent = '×';
      del.addEventListener('click', e => {
        e.stopPropagation();
        const list = getGalleryItems();
        list.splice(idx, 1);
        saveGalleryItems(list);
        renderGallery();
        showToast('削除しました');
      });

      card.addEventListener('click', () => {
        showSaveOverlay(item.full, 'png', false);
      });

      card.appendChild(img);
      card.appendChild(info);
      card.appendChild(del);
      grid.appendChild(card);
    });

    body.appendChild(grid);
  }

  function updateGalleryBadge() {
    // no-op for now
  }

  let gallerySize = 'medium';

  document.querySelectorAll('[data-gsize]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-gsize]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      gallerySize = btn.dataset.gsize;
      const grid = document.querySelector('.gallery-grid');
      if (grid) {
        grid.className = 'gallery-grid size-' + gallerySize;
      }
    });
  });

  $('#galleryClose').addEventListener('click', () => {
    $('#galleryPanel').classList.remove('open');
  });

  $('#galleryClearAll').addEventListener('click', () => {
    if (getGalleryItems().length === 0) return;
    saveGalleryItems([]);
    renderGallery();
    showToast('すべて削除しました');
  });

  // Paste from clipboard
  document.addEventListener('paste', e => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        loadImage(item.getAsFile());
        break;
      }
    }
  });
})();
</script>
